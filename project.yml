name: PartitionBudget
options:
  bundleIdPrefix: com.partitionbudget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "0.4.8"
    CURRENT_PROJECT_VERSION: "14"

targets:
  BudgetApp:
    type: application
    platform: iOS
    sources:
      - Sources/BudgetApp
      - Sources/Shared
    info:
      path: Sources/BudgetApp/Info.plist
      properties:
        CFBundleDisplayName: 分区预算
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.partitionbudget.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"

  BudgetAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/BudgetAppTests
    dependencies:
      - target: BudgetApp

schemes:
  BudgetApp:
    build:
      targets:
        BudgetApp: all
    test:
      targets:
        - BudgetAppTests
