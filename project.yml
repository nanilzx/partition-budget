name: PartitionBudget
options:
  bundleIdPrefix: com.partitionbudget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BudgetApp:
    type: application
    platform: iOS
    sources:
      - Sources/BudgetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.partitionbudget.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "分区预算"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "用于在解锁时验证你的身份，保护预算数据。"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"

  BudgetAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/BudgetAppTests
    dependencies:
      - target: BudgetApp

schemes:
  BudgetApp:
    build:
      targets:
        BudgetApp: all
    test:
      targets:
        - BudgetAppTests
